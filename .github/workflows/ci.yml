name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appdb_ci
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U appuser" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      AI_PROVIDER: mock
      DJANGO_SETTINGS_MODULE: config.settings_dev
      POSTGRES_DB: appdb_ci
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: WEB_Template/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: WEB_Template/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WEB_Template/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WEB_Template/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # T-378: smoke test v prohlížeči proti backendu bez IRIS (FHIR a vektory v paměti, mock AI) a next start
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appdb_dev
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U appuser" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      POSTGRES_PASSWORD: ci
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: WEB_Template/backend/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WEB_Template/frontend/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: WEB_Template/backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: WEB_Template/frontend
      - name: Backend bez IRIS (run_local.py)
        working-directory: WEB_Template/backend
        run: nohup python scripts/run_local.py > ../backend-e2e.log 2>&1 &
      - name: Frontend (next build + start)
        working-directory: WEB_Template/frontend
        run: npm run build && (nohup npx next start -p 3000 > ../frontend-e2e.log 2>&1 &)
      - name: Čekání na backend a frontend
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8000/api/health/ >/dev/null && curl -fsS http://localhost:3000/login >/dev/null && exit 0
            sleep 2
          done
          tail -n 50 WEB_Template/backend-e2e.log; exit 1
      - run: npx playwright test --trace off
        working-directory: WEB_Template/frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            WEB_Template/frontend/playwright-report
            WEB_Template/frontend/test-results
            WEB_Template/backend-e2e.log
            WEB_Template/frontend-e2e.log
          retention-days: 7
