  #   environment:
  #     DJANGO_SETTINGS_MODULE: config.settings_dev
  #   depends_on:
  #     - db
  #     - redis
  #   networks:
  #     - app-network

  # ===========================================================================
  # CELERY MONITORING – Flower (zakomentováno)
  # Web UI: http://localhost:5555
  # ===========================================================================
  # flower:
  #   image: mher/flower:latest
