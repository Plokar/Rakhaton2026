# =============================================================================
# Traefik – Statická konfigurace
# Hackathon Web Template
# =============================================================================

# API & Dashboard
api:
  dashboard: true
  insecure: false  # V produkci nastavit na false, chráněn přes middleware

# Entry Points
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

  # Traefik dashboard (interní, jen z Docker sítě)
  traefik:
    address: ":8080"

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: app-network

  # Dynamická konfigurace ze souborů
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Let's Encrypt (ACME) – TLS certifikáty
certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@yourdomain.com"   # ← Nahradit vaším e-mailem
      storage: /acme.json
      # Staging pro testování (odkomentovat při vývoji, zakomentovat pro produkci):
      # caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      httpChallenge:
        entryPoint: web

# Logging
log:
  level: "INFO"  # DEBUG, INFO, WARN, ERROR
  format: "json"

accessLog:
  format: "json"
  filters:
    statusCodes:
      - "400-599"

# Metrics (volitelné)
# metrics:
#   prometheus: {}
