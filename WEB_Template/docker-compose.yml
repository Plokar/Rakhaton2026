services:

  # ===========================================================================
  # TRAEFIK – Reverse Proxy & Load Balancer
  # Dashboard: https://traefik.yourdomain.com (chráněn basicAuth)
  # ===========================================================================
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs:/acme.json
    networks:
      - app-network
    # Dashboard Traefiku se ven nepublikuje (bez basicAuth by byl veřejný); MDT Copilot: ARCH §3.4
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # DATABASE – PostgreSQL 16
  # ===========================================================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Nepublikujeme port ven v produkci!

  # ===========================================================================
  # CACHE & MESSAGE BROKER – Redis 7
  # ===========================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Nepublikujeme port ven v produkci!

  # ===========================================================================
  # BACKEND – Django ASGI (Daphne) – HTTP + WebSockets
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_prod
      DJANGO_DEBUG: "False"
      # MDT Copilot (ARCH §3.4, §9): IRIS lokálně nebo v ACI podle env, dataset a báze read-only
      IRIS_HOST: ${IRIS_HOST:-iris}
      IRIS_PORT: "${IRIS_PORT:-1972}"
      IRIS_NAMESPACE: ${IRIS_NAMESPACE:-FHIRSERVER}
      IRIS_USER: ${IRIS_USER:-SuperUser}
      IRIS_PASSWORD: ${IRIS_PASSWORD:?IRIS_PASSWORD v .env (ne výchozí SYS)}
      FHIR_BASE_URL: ${FHIR_BASE_URL:-http://iris:52773/fhir/r4}
      DATASET_DIR: /data/dataset
      ONKO_KB_DIR: /data/onko
      ONKO_DATASET_DIR: /data/dataset
      ONKO_GUIDELINES_DIR: /data/dataset/guidelines
      ONKO_EXT_CATALOG: /code/services/iris/data/external_sources.json
      ONKO_APP_RULES: /code/services/rules/data/compatibility_rules.yaml
      AUDIO_DIR: /data/audio
      MDT_DEMO_CACHE_DIR: /data/demo_cache
      MDT_DEMO_OFFLINE: ${MDT_DEMO_OFFLINE:-False}
      MDT_SEED: ${MDT_SEED:-True}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      iris:
        condition: service_started
    networks:
      - app-network
    volumes:
      - backend_static:/code/staticfiles
      - backend_media:/code/media
      - ../Dataset_MDT_Copilot_v1.1_pre_timy/Dataset_MDT_Copilot_v1.1:/data/dataset:ro
      - ../data/onko:/data/onko:ro
      - ../data/audio:/data/audio:ro
      - ../data/demo_cache:/data/demo_cache
    labels:
      - "traefik.enable=true"
      # API na vlastní doméně (api.<doména>); frontend běží na Vercelu a volá /api přes rewrites (D-003)
      - "traefik.http.routers.backend.rule=Host(`${API_DOMAIN:?API_DOMAIN v .env, např. api.example.cz}`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/ws`) || PathPrefix(`/static`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=security-headers@file,rate-limit-api@file"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================================================
  # IRIS for Health – FHIR R4 + Vector Search (ARCH §3.4, §4.2)
  # Ven nic: backend se připojuje interně na iris:1972 a iris:52773.
  # Management Portal jen přes SSH tunel: ssh -L 52773:127.0.0.1:52773 <vps>
  # Výchozí heslo SYS změní `iris_init` při startu backendu na IRIS_PASSWORD.
  # ===========================================================================
  iris:
    build: ./iris
    restart: unless-stopped
    environment:
      ISC_DATA_DIRECTORY: /durable
    volumes:
      - iris_data:/durable
    ports:
      - "127.0.0.1:52773:52773"
    networks:
      - app-network

  # ===========================================================================
  # FRONTEND – Next.js (production build)
  # MDT Copilot nasazuje frontend na Vercel (D-001), tady jen volitelně: --profile frontend
  # ===========================================================================
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`yourdomain.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=security-headers@file,compress@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      # www redirect
      - "traefik.http.routers.frontend-www.rule=Host(`www.yourdomain.com`)"
      - "traefik.http.routers.frontend-www.entrypoints=websecure"
      - "traefik.http.routers.frontend-www.middlewares=redirect-www@file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

