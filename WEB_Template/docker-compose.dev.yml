services:

  # ===========================================================================
  # TRAEFIK – Reverse Proxy (Dev mód – bez HTTPS, dashboard otevřený)
  # Dashboard: http://localhost:8080
  # ===========================================================================
  traefik:
    image: traefik:v3.1
    ports:
      - "80:80"
      - "8080:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - app-network

  # ===========================================================================
  # DATABASE – PostgreSQL 16
  # ===========================================================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb_dev}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword123}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # Expose pro lokální přístup (DBeaver, psql, atd.)
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # CACHE – Redis 7
  # ===========================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-devredispass}
    volumes:
      - redis_data_dev:/data
    ports:
      - "6379:6379"   # Expose pro lokální přístup (Redis CLI, RedisInsight, atd.)
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devredispass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # BACKEND – Django ASGI s hot-reload
  # API: http://localhost/api/ nebo http://backend.localhost/api/
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    entrypoint: ["/bin/bash", "/code/entrypoint.sh"]
    volumes:
      - ./backend:/code        # Hot-reload: zmeny se okamžite projeví
      - /code/__pycache__      # Vyloučit cache z bind mountu
      - ../Dataset_MDT_Copilot_v1.1_pre_timy/Dataset_MDT_Copilot_v1.1:/data/dataset:ro
      - ../data/fixtures:/data/fixtures:ro                    # testy kontraktů (T-009)
      - ./frontend/src/fixtures:/data/frontend-fixtures:ro
      - ../data/dev_ground_truth:/data/dev_ground_truth:ro    # eval (T-013, T-301)
      - ../data/demo_cache:/data/demo_cache                    # záloha dema (T-311), zapisuje `demo save`
      - ../data/audio:/data/audio:ro                          # AI zapisovatel (T-305), simulovaná diskuse P03
      - ../data/onko:/data/onko:ro                            # znalostní báze semaforu (T-315, T-316)
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_dev
      DJANGO_DEBUG: "True"
      DATASET_DIR: /data/dataset
      FIXTURES_DIR: /data/fixtures
      FRONTEND_FIXTURES_DIR: /data/frontend-fixtures
      MDT_DEMO_CACHE_DIR: /data/demo_cache
      AUDIO_DIR: /data/audio
      ONKO_KB_DIR: /data/onko
      ONKO_EXT_CATALOG: /code/services/iris/data/external_sources.json
      ONKO_APP_RULES: /code/services/rules/data/compatibility_rules.yaml
      ONKO_GUIDELINES_DIR: /data/dataset/guidelines
      MDT_DEMO_OFFLINE: ${MDT_DEMO_OFFLINE:-False}
      IRIS_HOST: iris
      IRIS_PORT: "1972"
      IRIS_NAMESPACE: FHIRSERVER
      IRIS_USER: ${IRIS_USER:-SuperUser}
      IRIS_PASSWORD: ${IRIS_PASSWORD:-SYS}
      FHIR_BASE_URL: http://iris:52773/fhir/r4
    ports:
      - "8000:8000"   # Přímý přístup pro debugging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      iris:
        condition: service_started
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-dev.rule=PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/ws`)"
      - "traefik.http.routers.backend-dev.entrypoints=web"
      - "traefik.http.services.backend-dev.loadbalancer.server.port=8000"

  # ===========================================================================
  # IRIS for Health – FHIR R4 (nemocniční DB) + Vector Search (ARCH §4.2)
  # FHIR: http://localhost:52773/fhir/r4 (po iris_init) · Portal: /csp/sys/UtilHome.csp
  # Dev login SuperUser / SYS
  # ===========================================================================
  iris:
    build: ./iris
    restart: unless-stopped
    environment:
      ISC_DATA_DIRECTORY: /durable
    volumes:
      - iris_data_dev:/durable
    ports:
      - "1972:1972"     # superserver (DB-API)
      - "52773:52773"   # web (FHIR, Management Portal)
    networks:
      - app-network

  # ===========================================================================
  # FRONTEND – Next.js dev server s hot-reload (Turbopack)
  # App: http://localhost:3000 nebo http://localhost
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ./frontend:/app          # Hot-reload
      - /app/node_modules        # Zachovat node_modules z image
      - /app/.next               # Zachovat .next cache
    ports:
      - "3000:3000"   # Přímý přístup
    env_file:
      - .env
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"  # Pro Windows/WSL hot-reload
    depends_on:
      - backend
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-dev.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend-dev.entrypoints=web"
      - "traefik.http.services.frontend-dev.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend-dev.priority=1"  # Nižší priorita než backend

  # ===========================================================================
  # EMAIL TESTING – Mailhog (zachytí všechny e-maily v dev)
  # Web UI: http://localhost:8025
  # SMTP: localhost:1025
  # ===========================================================================
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mailhog.localhost`)"
      - "traefik.http.routers.mailhog.entrypoints=web"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"

  # ===========================================================================
  # VECTOR DATABASE – Qdrant (zakomentováno – odkomentovat pro AI/RAG)
  # Dashboard: http://localhost:6333/dashboard
  # ===========================================================================
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports:
