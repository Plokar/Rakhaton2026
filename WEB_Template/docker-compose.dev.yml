  #   networks:
  #     - app-network

  # ===========================================================================
  # OBJECT STORAGE – MinIO (zakomentováno – S3-compatible)
  # Console: http://localhost:9001 (user: minioadmin / minioadmin)
  # ===========================================================================
  # minio:
  #   image: minio/minio:latest
