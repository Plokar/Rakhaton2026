name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: appdb_ci
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U appuser" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      AI_PROVIDER: mock
      DJANGO_SETTINGS_MODULE: config.settings_dev
      POSTGRES_DB: appdb_ci
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379
    defaults:
      run:
        working-directory: WEB_Template/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: WEB_Template/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WEB_Template/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WEB_Template/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
        continue-on-error: true  # 12 chyb react-hooks v template stránkách (Q13, UI lane); po opravě smazat
      - run: npm run build
